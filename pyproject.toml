# ---------------------------------------------------------------------------
# Project metadata (PEP 621). This is the standard, tool-agnostic description
# of the package. uv, pip, and build backends all read this same table.
# ---------------------------------------------------------------------------
[project]
name = "pulseforge"
version = "0.0.0"
description = "A change-aware performance regression gate for API services."
readme = "README.md"
requires-python = ">=3.12,<3.13"   # ADR-006. Upper bound is deliberate.
license = { file = "LICENSE" }
authors = [{ name = "Aadit Aggarwal", email = "aadit.asr@gmail.com" }]

# Runtime dependencies. Empty on purpose: nothing is built yet, and adding
# FastAPI now would be speculation. Each phase adds what it actually needs.
dependencies = []

# ---------------------------------------------------------------------------
# Development dependencies (PEP 735). Not shipped to users of the package.
# Lower bounds only -- uv.lock is what pins the exact versions.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]

# ---------------------------------------------------------------------------
# Build backend. Without this, uv cannot install the project into its own
# virtualenv, and `import app` fails in tests. hatchling is chosen because it
# needs no plugins and no setup.py.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff: lint and format in one tool (ADR-006).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: whitespace and layout
    "F",        # pyflakes: unused imports, undefined names
    "I",        # isort: import ordering
    "N",        # pep8-naming
    "UP",       # pyupgrade: rewrite to modern 3.12 syntax
    "B",        # bugbear: mutable default args, loop-variable capture
    "C4",       # comprehensions
    "SIM",      # simplify: collapsible ifs, redundant bools
    "PTH",      # force pathlib over os.path -- os.path silently mishandles
                # Windows vs POSIX separators, and this project writes many
                # content-addressed paths (ADR-002)
    "ASYNC",    # blocking calls inside async functions -- the single easiest
                # way to destroy the replay engine's timing accuracy
    "S",        # bandit security rules; the sanitizer is a security boundary
    "T20",      # ban print(); structured logging only (OBSERVABILITY.md)
    "ARG",      # unused arguments
    "RUF",      # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG"]   # assert is the point of a test

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict on app/ only. Tests get type hints but not strict enforcement.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -ra"
markers = [
    "e2e: end-to-end tests that start the target service",
    "slow: tests taking more than a second",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
